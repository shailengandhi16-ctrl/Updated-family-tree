body::before { content:''; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:0; }
#app { position:relative; z-index:1; display:flex; flex-direction:column; min-height:100vh; }
h1 {
  text-align:center; padding:14px 20px; font-size:22px; font-weight:700;
  color:#fff; text-shadow:0 2px 8px rgba(0,0,0,0.8);
  background:rgba(0,0,0,0.4); border-bottom:1px solid rgba(255,255,255,0.15); letter-spacing:0.5px;
}
#toolbar {
  display:flex; align-items:center; flex-wrap:wrap; gap:10px; padding:10px 16px;
  background:rgba(0,0,0,0.45); border-bottom:1px solid rgba(255,255,255,0.12);
  backdrop-filter:blur(6px); position:relative; z-index:50;
}
.tool-group { display:flex; align-items:center; gap:6px; }
.tool-label { font-size:11px; color:rgba(255,255,255,0.55); text-transform:uppercase; letter-spacing:0.5px; }
.btn {
  display:inline-flex; align-items:center; gap:5px; padding:6px 13px; border-radius:6px;
  font-size:13px; font-family:Arial,sans-serif; cursor:pointer;
  border:1px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.12); color:#fff;
  transition:background 0.15s,border-color 0.15s; user-select:none; white-space:nowrap;
}
.btn:hover { background:rgba(255,255,255,0.24); border-color:rgba(255,255,255,0.45); }
.btn:active { background:rgba(255,255,255,0.32); }
.btn-zoom { background:rgba(30,90,180,0.35); border-color:rgba(100,160,255,0.4); font-size:16px; padding:4px 12px; min-width:36px; justify-content:center; }
.btn-zoom:hover { background:rgba(30,90,180,0.55); }
#zoom-level { font-size:12px; color:rgba(255,255,255,0.7); min-width:38px; text-align:center; }
.btn-reset { background:rgba(20,100,60,0.4); border-color:rgba(80,200,130,0.4); }
.btn-reset:hover { background:rgba(20,100,60,0.6); }
.btn-clear { background:rgba(160,30,30,0.35); border-color:rgba(255,100,100,0.4); }
.btn-clear:hover { background:rgba(160,30,30,0.55); }
.search-wrap { position:relative; display:flex; align-items:center; gap:0; }
#search-input {
  padding:6px 12px; border-radius:6px 0 0 6px; border:1px solid rgba(255,255,255,0.3);
  border-right:none; background:rgba(255,255,255,0.12); color:#fff; font-size:13px;
  font-family:Arial,sans-serif; width:170px; outline:none; transition:background 0.15s;
}
#search-input::placeholder { color:rgba(255,255,255,0.45); }
#search-input:focus { background:rgba(255,255,255,0.2); }
#search-btn {
  padding:6px 12px; border-radius:0 6px 6px 0; border:1px solid rgba(255,255,255,0.3);
  background:rgba(200,160,20,0.45); color:#fff; font-size:13px;
  font-family:Arial,sans-serif; cursor:pointer; transition:background 0.15s; white-space:nowrap;
}
#search-btn:hover { background:rgba(200,160,20,0.65); }
#search-dropdown {
  display:none; position:absolute; top:calc(100% + 4px); left:0; width:220px;
  background:rgba(20,20,30,0.95); border:1px solid rgba(255,255,255,0.2);
  border-radius:6px; z-index:100; max-height:220px; overflow-y:auto; backdrop-filter:blur(8px);
}
#search-dropdown.open { display:block; }
.dd-item { padding:8px 12px; color:#ddd; font-size:13px; cursor:pointer; border-bottom:1px solid rgba(255,255,255,0.07); }
.dd-item:last-child { border-bottom:none; }
.dd-item:hover { background:rgba(255,255,255,0.12); color:#fff; }
.dd-item mark { background:transparent; color:#ffd060; font-weight:bold; }
.legend { display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-left:auto; }
.leg { display:flex; align-items:center; gap:5px; font-size:11px; color:rgba(255,255,255,0.8); }
.ls { width:12px; height:12px; border-radius:3px; border:1px solid rgba(255,255,255,0.3); flex-shrink:0; }
#rel-panel {
  padding:8px 16px; background:rgba(10,50,110,0.7); border-bottom:1px solid rgba(255,255,255,0.1);
  color:#cce4ff; font-size:13px; min-height:36px; display:flex; align-items:center; backdrop-filter:blur(4px);
}
#ft-wrap { flex:1; overflow:hidden; cursor:grab; position:relative; min-height:460px; }
#ft-wrap:active { cursor:grabbing; }
#ft-canvas { position:absolute; transform-origin:0 0; }
#footer {
  text-align:center; padding:7px; font-size:12px; color:rgba(255,255,255,0.5);
  background:rgba(0,0,0,0.4); border-top:1px solid rgba(255,255,255,0.08);
}
@keyframes pulse-outline {
  0%   { stroke-opacity:1; stroke-width:3; }
  50%  { stroke-opacity:0.4; stroke-width:5; }
  100% { stroke-opacity:1; stroke-width:3; }
}
.search-highlight { animation:pulse-outline 1s ease-in-out 3; }
</style>
</head>
<body>
<div id="app">
  <h1>Gandhi Family Tree</h1>
  <div id="toolbar">
    <div class="tool-group">
      <span class="tool-label">Zoom</span>
      <button class="btn btn-zoom" onclick="zoomBy(1.25)" title="Zoom in">＋</button>
      <span id="zoom-level">100%</span>
      <button class="btn btn-zoom" onclick="zoomBy(0.8)" title="Zoom out">－</button>
    </div>
    <div class="tool-group">
      <button class="btn" onclick="setZoom(0.5)">50%</button>
      <button class="btn" onclick="setZoom(1.0)">100%</button>
      <button class="btn" onclick="setZoom(1.5)">150%</button>
    </div>
    <div class="tool-group">
      <button class="btn btn-reset" onclick="resetView()">⌂ Fit tree</button>
      <button class="btn btn-reset" onclick="centerRoot()">⊙ Center root</button>
    </div>
    <div class="tool-group">
      <button class="btn btn-clear" onclick="clearSel()">✕ Clear selection</button>
    </div>
    <div class="tool-group search-wrap" id="search-wrap">
      <span class="tool-label">Search</span>
      <div style="position:relative">
        <input id="search-input" type="text" placeholder="Find a person..." autocomplete="off"
               oninput="onSearchInput()" onkeydown="onSearchKey(event)" />
        <div id="search-dropdown"></div>
      </div>
      <button id="search-btn" onclick="doSearch()">🔍 Find</button>
    </div>
    <div class="legend">
      <div class="leg"><div class="ls" style="background:#EEEDFE;border-color:#534AB7"></div>Root</div>
      <div class="leg"><div class="ls" style="background:#E1F5EE;border-color:#0F6E56"></div>Gen 2</div>
      <div class="leg"><div class="ls" style="background:#E6F1FB;border-color:#185FA5"></div>Gen 3</div>
      <div class="leg"><div class="ls" style="background:#FAEEDA;border-color:#854F0B"></div>Gen 4</div>
      <div class="leg"><div class="ls" style="background:#EAF3DE;border-color:#3B6D11"></div>Gen 5</div>
      <div class="leg"><div class="ls" style="background:#FBEAF0;border-color:#993356"></div>Gen 6</div>
      <div class="leg"><div class="ls" style="background:#FAECE7;border-color:#993C1D"></div>Spouse</div>
    </div>
  </div>
  <div id="rel-panel">Click any two people to see their relationship.</div>
  <div id="ft-wrap">
    <div id="ft-canvas"><svg id="tree-svg"></svg></div>
  </div>
  <div id="footer">Drag to pan &nbsp;·&nbsp; Scroll / pinch to zoom &nbsp;·&nbsp; Click two people to compare &nbsp;·&nbsp; Search to find & zoom to a person</div>
</div>

// Returns extra height added above a node due to a photo
function photoH(name){ return PHOTOS[name] ? PHOTO_SIZE+PHOTO_PAD : 0; }

function slotW(n){ return (n.spouse&&!n.noMarriage)?PW:BW; }
function measure(n){
  if(!n.children||!n.children.length){n._w=slotW(n);return;}
  n.children.forEach(c=>measure(c));
  const t=n.children.reduce((s,c)=>s+c._w,0)+(n.children.length-1)*HG;
  n._w=Math.max(slotW(n),t);
}
const allNodes=[];
function layout(n,x,y,g,parent){
  // y is the top of the name box. The photo (if any) extends upward from there.
  n._x=x; n._y=y; n._gen=g; n._parent=parent||null;
  allNodes.push(n);
  if(n.children&&n.children.length){
    const t=n.children.reduce((s,c)=>s+c._w,0)+(n.children.length-1)*HG;
    let cx=x+(n._w-t)/2;
    // Children start below this node's name box; account for VG from bottom of name box
    n.children.forEach(c=>{
      // Extra space needed above child if child has a photo
      const childPhotoH=photoH(c.name)+(c.spouse&&!c.noMarriage?photoH(c.spouse):0);
      // We don't need to shift children down for their own photos since photos go above _y
      layout(c,cx,y+BH+VG,g+1,n);
      cx+=c._w+HG;
    });
  }
}

  const vl=n._x+n._w/2-slotW(n)/2;
  return (n.spouse&&!n.noMarriage)?vl+BW+GAP/2:vl+BW/2;
}

measure(tree);
// Add extra top margin for root photos
const rootPhotoH = photoH(tree.name) + photoH(tree.spouse||"");
layout(tree,20,rootPhotoH+20,0,null);

const TW=tree._w+60;
const TH=allNodes.reduce((m,n)=>Math.max(m,n._y),0)+BH+40;

const svg=document.getElementById("tree-svg");
svg.setAttribute("width",TW); svg.setAttribute("height",TH);
svg.setAttribute("viewBox","0 0 "+TW+" "+TH);

// defs for clip paths
const defs=document.createElementNS("http://www.w3.org/2000/svg","defs");
svg.appendChild(defs);
const edgeG=document.createElementNS("http://www.w3.org/2000/svg","g"); svg.appendChild(edgeG);
const nodeG=document.createElementNS("http://www.w3.org/2000/svg","g"); svg.appendChild(nodeG);
const selG=document.createElementNS("http://www.w3.org/2000/svg","g");  svg.appendChild(selG);
const hlG=document.createElementNS("http://www.w3.org/2000/svg","g");   svg.appendChild(hlG);

function drawEdges(n){
  if(!n.children||!n.children.length)return;
  const px=coupleCX(n),py=n._y+BH,my=py+VG*0.45;
  n.children.forEach(c=>{
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d","M"+px+","+py+" L"+px+","+my+" L"+coupleCX(c)+","+my+" L"+coupleCX(c)+","+c._y);
    p.setAttribute("fill","none"); p.setAttribute("stroke","rgba(255,255,255,0.55)"); p.setAttribute("stroke-width","1.4");
    edgeG.appendChild(p); drawEdges(c);
  });
}
drawEdges(tree);

// Draw a photo above a box at (bx, by) with width BW
let clipCount=0;
function drawPhoto(name,bx,by,strokeColor){
  const ph=PHOTOS[name]; if(!ph) return;
  const clipId="ph-clip-"+(clipCount++);
  const cp=document.createElementNS("http://www.w3.org/2000/svg","clipPath");
  cp.setAttribute("id",clipId);
  const rect=document.createElementNS("http://www.w3.org/2000/svg","rect");
  rect.setAttribute("x",bx); rect.setAttribute("y",by-PHOTO_SIZE-PHOTO_PAD);
  rect.setAttribute("width",PHOTO_SIZE); rect.setAttribute("height",PHOTO_SIZE); rect.setAttribute("rx","6");
  cp.appendChild(rect); defs.appendChild(cp);
  const img=document.createElementNS("http://www.w3.org/2000/svg","image");
  img.setAttribute("href",ph);
  img.setAttribute("x",bx); img.setAttribute("y",by-PHOTO_SIZE-PHOTO_PAD);
  img.setAttribute("width",PHOTO_SIZE); img.setAttribute("height",PHOTO_SIZE);
  img.setAttribute("clip-path","url(#"+clipId+")");
  img.setAttribute("preserveAspectRatio","xMidYMid slice");
  img.setAttribute("pointer-events","none");
  nodeG.appendChild(img);
  // border
  const border=document.createElementNS("http://www.w3.org/2000/svg","rect");
  border.setAttribute("x",bx); border.setAttribute("y",by-PHOTO_SIZE-PHOTO_PAD);
  border.setAttribute("width",PHOTO_SIZE); border.setAttribute("height",PHOTO_SIZE); border.setAttribute("rx","6");
  border.setAttribute("fill","none"); border.setAttribute("stroke",strokeColor); border.setAttribute("stroke-width","2");
  border.setAttribute("pointer-events","none");
  nodeG.appendChild(border);
}

const nodeRects=[];
const searchIndex=[];

function drawNode(n){
  const gc=GC[Math.min(n._gen,GC.length-1)];
  const vl=n._x+n._w/2-slotW(n)/2, by=n._y;

  // Draw photo above primary box
  drawPhoto(n.name, vl, by, gc[1]);

  // Primary name box
  const g=document.createElementNS("http://www.w3.org/2000/svg","g");
  const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
  r.setAttribute("x",vl); r.setAttribute("y",by); r.setAttribute("width",BW); r.setAttribute("height",BH);
  r.setAttribute("rx","5"); r.setAttribute("fill",gc[0]); r.setAttribute("stroke",gc[1]); r.setAttribute("stroke-width","1.5");
  r.style.cursor="pointer"; g.appendChild(r);
  const t=document.createElementNS("http://www.w3.org/2000/svg","text");
  t.setAttribute("x",vl+BW/2); t.setAttribute("y",by+BH/2);
  t.setAttribute("text-anchor","middle"); t.setAttribute("dominant-baseline","central");
  t.setAttribute("font-size","10"); t.setAttribute("fill",gc[2]); t.setAttribute("font-weight","bold");
  t.setAttribute("font-family","Arial,sans-serif"); t.setAttribute("pointer-events","none");
  t.textContent=n.name; g.appendChild(t);
  g.addEventListener("click",()=>handleClick(n,false));
  nodeG.appendChild(g);
  nodeRects.push({node:n,x:vl,y:by,w:BW,h:BH,isSpouse:false});
  searchIndex.push({label:n.name,node:n,isSpouse:false,x:vl,y:by,w:BW,h:BH});

  if(n.spouse&&!n.noMarriage){
    const sx=vl+BW+GAP;
    const ml=document.createElementNS("http://www.w3.org/2000/svg","line");
    ml.setAttribute("x1",vl+BW); ml.setAttribute("y1",by+BH/2);
    ml.setAttribute("x2",sx);    ml.setAttribute("y2",by+BH/2);
    ml.setAttribute("stroke",SC[1]); ml.setAttribute("stroke-width","1.5"); ml.setAttribute("stroke-dasharray","3 2");
    edgeG.appendChild(ml);

    // Draw photo above spouse box
    drawPhoto(n.spouse, sx, by, SC[1]);

    const sg=document.createElementNS("http://www.w3.org/2000/svg","g");
    const sr=document.createElementNS("http://www.w3.org/2000/svg","rect");
    sr.setAttribute("x",sx); sr.setAttribute("y",by); sr.setAttribute("width",BW); sr.setAttribute("height",BH);
    sr.setAttribute("rx","5"); sr.setAttribute("fill",SC[0]); sr.setAttribute("stroke",SC[1]); sr.setAttribute("stroke-width","1.5");
    sr.style.cursor="pointer"; sg.appendChild(sr);
    const st=document.createElementNS("http://www.w3.org/2000/svg","text");
    st.setAttribute("x",sx+BW/2); st.setAttribute("y",by+BH/2);
    st.setAttribute("text-anchor","middle"); st.setAttribute("dominant-baseline","central");
    st.setAttribute("font-size","10"); st.setAttribute("fill",SC[2]);
    st.setAttribute("font-family","Arial,sans-serif"); st.setAttribute("pointer-events","none");
    st.textContent=n.spouse; sg.appendChild(st);
    sg.addEventListener("click",()=>handleClick(n,true));
    nodeG.appendChild(sg);
    nodeRects.push({node:n,x:sx,y:by,w:BW,h:BH,isSpouse:true});
    searchIndex.push({label:n.spouse,node:n,isSpouse:true,x:sx,y:by,w:BW,h:BH});
  }
  if(n.children)n.children.forEach(c=>drawNode(c));
}
drawNode(tree);

// ── Selection ──────────────────────────────────────────────────────
let sel=[];
function clearSel(){
  sel=[];selG.innerHTML="";
  document.getElementById("rel-panel").textContent="Click any two people to see their relationship.";
}
function highlight(entry){
  const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
  r.setAttribute("x",entry.x-2); r.setAttribute("y",entry.y-2);
  r.setAttribute("width",entry.w+4); r.setAttribute("height",entry.h+4);
  r.setAttribute("rx","7"); r.setAttribute("fill","none");
  r.setAttribute("stroke",SEL_STROKE); r.setAttribute("stroke-width","2.5");
  selG.appendChild(r);
}
function handleClick(node,isSpouse){
  const name=isSpouse?node.spouse:node.name;
  const entry=nodeRects.find(nr=>nr.node===node&&nr.isSpouse===isSpouse);
  if(!entry)return;
  if(sel.length===2)clearSel();
  if(sel.find(s=>s.name===name))return;
  sel.push({name,node,isSpouse,entry});
  highlight(entry);
  if(sel.length===2){
    document.getElementById("rel-panel").textContent=sel[0].name+" & "+sel[1].name+": "+getRelationship(sel[0],sel[1]);
  } else {
    document.getElementById("rel-panel").textContent="Selected: "+sel[0].name+". Now click a second person.";
  }
}

// ── Relationship logic ─────────────────────────────────────────────
const MALES=new Set(["Chhotlal K. Gandhi","Kanti bhai","Chiman bhai","Chimanlal","Raman bhai","Thakorlal","Amratlal","Indravadan","Mohanlal","Suresh","Tarak","Foram","Nilay","Alekh","Ankur","Hitesh","Devang","Kamlesh","Anil","Mahesh","Pankaj","Maxi","Raju","Mukesh","Ajay","Ramesh","Ramanlal","Bipin Chandra","Bipin","Romil","Sanjay","Suketu","Nevil","Amish","Samir","Preet","Rajiv","Rahul","Ankit","Kaushal","Vinit","Kunal","Nikhil","Amit","Pritesh","Bhavik","Justin","Neel","Alex","Shailen","Ayaan","Sahil","Kiyan","Niam","Naksh","Liam","Jais","Jaden","Kavin","Ashton","Yug","Darsh","Yash"]);
function isMale(name){ return MALES.has(name); }

function genderRel(rel,name){
  const m=isMale(name);
  if(rel==="parent")return m?"father":"mother";
  if(rel==="child")return m?"son":"daughter";
  if(rel==="sibling")return m?"brother":"sister";
  if(rel==="grandparent")return m?"grandfather":"grandmother";
  if(rel==="grandchild")return m?"grandson":"granddaughter";
  if(rel==="uncle/aunt")return m?"uncle":"aunt";
  if(rel==="nephew/niece")return m?"nephew":"niece";
  if(rel.endsWith("grandparent"))return rel.replace("grandparent",m?"grandfather":"grandmother");
  if(rel.endsWith("grandchild"))return rel.replace("grandchild",m?"grandson":"granddaughter");
  if(rel.endsWith("uncle/aunt"))return rel.replace("uncle/aunt",m?"uncle":"aunt");
  if(rel.endsWith("nephew/niece"))return rel.replace("nephew/niece",m?"nephew":"niece");
  return rel;
}

function oppTerm(term,forName){
  const m=isMale(forName);
  const fm={"son":"daughter","father":"mother","brother":"sister","grandson":"granddaughter","grandfather":"grandmother","nephew":"niece","uncle":"aunt","husband":"wife","son-in-law":"daughter-in-law","father-in-law":"mother-in-law","brother-in-law":"sister-in-law","nephew-in-law":"niece-in-law","uncle-in-law":"aunt-in-law"};
  const direct={"father":"son","mother":"son","son":"father","daughter":"father","brother":"brother","sister":"brother","grandfather":"grandson","grandmother":"grandson","grandson":"grandfather","granddaughter":"grandfather","uncle":"nephew","aunt":"nephew","nephew":"uncle","niece":"uncle","husband":"wife","wife":"husband","father-in-law":"son-in-law","mother-in-law":"son-in-law","son-in-law":"father-in-law","daughter-in-law":"father-in-law","brother-in-law":"brother-in-law","sister-in-law":"brother-in-law","uncle-in-law":"nephew-in-law","aunt-in-law":"nephew-in-law","nephew-in-law":"uncle-in-law","niece-in-law":"uncle-in-law"};
  if(term in direct){const base=direct[term];return m?base:(fm[base]||base);}
  if(term.endsWith(" (by marriage)"))return oppTerm(term.slice(0,-14),forName)+" (by marriage)";
  for(const [sfx,opp] of [["grandfather","grandson"],["grandmother","grandson"],["grandson","grandfather"],["granddaughter","grandfather"],["uncle","nephew"],["aunt","nephew"],["nephew","uncle"],["niece","uncle"]]){
    if(term.endsWith(sfx)){const pre=term.slice(0,-sfx.length);const base=opp;return pre+(m?base:(fm[base]||base));}
  }
  return term;
}

function getAncestors(node){const anc=[];let cur=node._parent;while(cur){anc.push(cur);cur=cur._parent;}return anc;}
function ordinal(n){if(n===1)return"1st";if(n===2)return"2nd";if(n===3)return"3rd";return n+"th";}
function labelFromAtoB(u,d){
  if(u===0){if(d===1)return"parent";if(d===2)return"grandparent";return"great-".repeat(d-2)+"grandparent";}
  if(d===0){if(u===1)return"child";if(u===2)return"grandchild";return"great-".repeat(u-2)+"grandchild";}
  if(u===d){if(u===1)return"sibling";return ordinal(u-1)+" cousin";}
  const cl=Math.min(u,d),fa=Math.max(u,d),ac=u<=d;
  if(cl===1){const gr="great-".repeat(fa-2);if(ac)return fa===2?"uncle/aunt":gr+"uncle/aunt";else return fa===2?"nephew/niece":gr+"nephew/niece";}
  return ac?ordinal(cl-1)+" cousin's nephew/niece":"nephew/niece of "+ordinal(cl-1)+" cousin";
}
function bloodRel(p,q){
  const ap=getAncestors(p),aq=getAncestors(q);
  const pi=aq.indexOf(p);if(pi>=0)return labelFromAtoB(0,pi+1);
  const qi=ap.indexOf(q);if(qi>=0)return labelFromAtoB(qi+1,0);
  for(let i=0;i<ap.length;i++){const j=aq.indexOf(ap[i]);if(j>=0)return labelFromAtoB(i+1,j+1);}
  return null;
}
function getRelationship(a,b){
  const na=a.node,nb=b.node;
  const aName=a.isSpouse?a.node.spouse:a.node.name;
  const bName=b.isSpouse?b.node.spouse:b.node.name;
  function pair(aT,bT){return aT+"/"+bT;}
  if(na===nb)return pair(isMale(aName)?"husband":"wife",isMale(bName)?"husband":"wife");
  if(na._parent===nb){const aT=a.isSpouse?(isMale(aName)?"son-in-law":"daughter-in-law"):(isMale(aName)?"son":"daughter");return pair(aT,oppTerm(aT,bName));}
  if(nb._parent===na){const bT=b.isSpouse?(isMale(bName)?"son-in-law":"daughter-in-law"):(isMale(bName)?"son":"daughter");return pair(oppTerm(bT,aName),bT);}
  const rel=bloodRel(na,nb);
  if(!rel)return"No direct family relationship found";
  if(a.isSpouse&&b.isSpouse){const aT=genderRel(rel,aName)+" (by marriage)";return pair(aT,oppTerm(aT,bName));}
  if(a.isSpouse||b.isSpouse){
    const inName=a.isSpouse?aName:bName,otherName=a.isSpouse?bName:aName,m=isMale(inName);
    let inT,otherT;
    if(rel==="sibling"){inT=m?"brother-in-law":"sister-in-law";otherT=isMale(otherName)?"brother-in-law":"sister-in-law";}
    else if(rel==="parent"){inT=m?"father-in-law":"mother-in-law";otherT=isMale(otherName)?"son-in-law":"daughter-in-law";}
    else if(rel==="child"){inT=m?"son-in-law":"daughter-in-law";otherT=isMale(otherName)?"father-in-law":"mother-in-law";}
    else if(rel==="uncle/aunt"){inT=m?"uncle-in-law":"aunt-in-law";otherT=isMale(otherName)?"nephew-in-law":"niece-in-law";}
    else if(rel==="nephew/niece"){inT=m?"nephew-in-law":"niece-in-law";otherT=isMale(otherName)?"uncle-in-law":"aunt-in-law";}
    else{inT=genderRel(rel,inName)+" (by marriage)";otherT=oppTerm(inT,otherName);}
    return a.isSpouse?pair(inT,otherT):pair(otherT,inT);
  }
  const aT=genderRel(rel,aName);
  return pair(aT,oppTerm(aT,bName));
}

// ── Search ─────────────────────────────────────────────────────────
let ddItems=[],ddIndex=-1;
function onSearchInput(){
  const q=document.getElementById("search-input").value.trim().toLowerCase();
  const dd=document.getElementById("search-dropdown");ddIndex=-1;
  if(q.length<1){dd.innerHTML="";dd.classList.remove("open");return;}
  const matches=searchIndex.filter(e=>e.label.toLowerCase().includes(q));
  if(matches.length===0){dd.innerHTML='<div class="dd-item" style="color:rgba(255,255,255,0.4)">No results</div>';dd.classList.add("open");return;}
  ddItems=matches.slice(0,12);
  dd.innerHTML=ddItems.map((m,i)=>{
    const hl=m.label.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");
    return '<div class="dd-item" data-i="'+i+'">'+hl+"</div>";
  }).join("");
  dd.classList.add("open");
  dd.querySelectorAll(".dd-item").forEach(el=>{el.addEventListener("mousedown",e=>{e.preventDefault();selectSearchResult(ddItems[parseInt(el.dataset.i)]);});});
}
function onSearchKey(e){
  const dd=document.getElementById("search-dropdown");
  const items=dd.querySelectorAll(".dd-item[data-i]");
  if(e.key==="ArrowDown"){e.preventDefault();ddIndex=Math.min(ddIndex+1,items.length-1);items.forEach((el,i)=>el.style.background=i===ddIndex?"rgba(255,255,255,0.18)":"");}
  else if(e.key==="ArrowUp"){e.preventDefault();ddIndex=Math.max(ddIndex-1,0);items.forEach((el,i)=>el.style.background=i===ddIndex?"rgba(255,255,255,0.18)":"");}
  else if(e.key==="Enter"){e.preventDefault();if(ddIndex>=0&&ddItems[ddIndex])selectSearchResult(ddItems[ddIndex]);else doSearch();}
  else if(e.key==="Escape"){dd.innerHTML="";dd.classList.remove("open");}
}
function doSearch(){
  const q=document.getElementById("search-input").value.trim().toLowerCase();
  if(!q)return;
  const match=searchIndex.find(e=>e.label.toLowerCase()===q)||searchIndex.find(e=>e.label.toLowerCase().startsWith(q))||searchIndex.find(e=>e.label.toLowerCase().includes(q));
  if(match)selectSearchResult(match);
  const dd=document.getElementById("search-dropdown");dd.innerHTML="";dd.classList.remove("open");
}
function selectSearchResult(entry){
  const dd=document.getElementById("search-dropdown");dd.innerHTML="";dd.classList.remove("open");
  document.getElementById("search-input").value=entry.label;
  zoomToEntry(entry);
}
function zoomToEntry(entry){
  hlG.innerHTML="";
  const ring=document.createElementNS("http://www.w3.org/2000/svg","rect");
  ring.setAttribute("x",entry.x-4);ring.setAttribute("y",entry.y-4);
  ring.setAttribute("width",entry.w+8);ring.setAttribute("height",entry.h+8);
  ring.setAttribute("rx","9");ring.setAttribute("fill","none");
  ring.setAttribute("stroke","#FFD060");ring.setAttribute("stroke-width","3");
  ring.classList.add("search-highlight");hlG.appendChild(ring);
  const targetScale=1.6;
  const ww=wrap.clientWidth,wh=wrap.clientHeight;
  const boxCX=entry.x+entry.w/2,boxCY=entry.y+entry.h/2;
  const targetOX=ww/2-boxCX*targetScale,targetOY=wh/2-boxCY*targetScale;
  const startScale=scale,startOX=ox,startOY=oy;
  const dur=500,start=performance.now();
  function step(now){
    const t=Math.min((now-start)/dur,1);const ease=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    scale=startScale+(targetScale-startScale)*ease;ox=startOX+(targetOX-startOX)*ease;oy=startOY+(targetOY-startOY)*ease;applyT();
    if(t<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  setTimeout(()=>{hlG.innerHTML="";},4000);
}
document.addEventListener("click",e=>{if(!document.getElementById("search-wrap").contains(e.target)){const dd=document.getElementById("search-dropdown");dd.innerHTML="";dd.classList.remove("open");}});

// ── Pan & zoom ─────────────────────────────────────────────────────
let scale=1,ox=0,oy=0,drag=false,lx=0,ly=0;
const wrap=document.getElementById("ft-wrap");
const canvas=document.getElementById("ft-canvas");
function applyT(){canvas.style.transform="translate("+ox+"px,"+oy+"px) scale("+scale+")";document.getElementById("zoom-level").textContent=Math.round(scale*100)+"%";}
function zoomAround(f,cx,cy){const ns=Math.min(4,Math.max(0.08,scale*f));ox=cx-(cx-ox)*(ns/scale);oy=cy-(cy-oy)*(ns/scale);scale=ns;applyT();}
function zoomBy(f){zoomAround(f,wrap.clientWidth/2,wrap.clientHeight/2);}
function setZoom(t){zoomAround(t/scale,wrap.clientWidth/2,wrap.clientHeight/2);}
function resetView(){const ww=wrap.clientWidth,wh=wrap.clientHeight;scale=Math.min(ww/TW,wh/TH,1);ox=(ww-TW*scale)/2;oy=16;applyT();}
function centerRoot(){ox=wrap.clientWidth/2-coupleCX(tree)*scale;oy=30;applyT();}
wrap.addEventListener("mousedown",e=>{drag=true;lx=e.clientX;ly=e.clientY;});
window.addEventListener("mouseup",()=>drag=false);
window.addEventListener("mousemove",e=>{if(!drag)return;ox+=e.clientX-lx;oy+=e.clientY-ly;lx=e.clientX;ly=e.clientY;applyT();});
wrap.addEventListener("wheel",e=>{e.preventDefault();const rect=wrap.getBoundingClientRect();zoomAround(e.deltaY<0?1.1:0.9,e.clientX-rect.left,e.clientY-rect.top);},{passive:false});
wrap.addEventListener("touchstart",e=>{if(e.touches.length===1){drag=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}},{passive:true});
wrap.addEventListener("touchend",()=>drag=false,{passive:true});
wrap.addEventListener("touchmove",e=>{if(!drag||e.touches.length!==1)return;ox+=e.touches[0].clientX-lx;oy+=e.touches[0].clientY-ly;lx=e.touches[0].clientX;ly=e.touches[0].clientY;applyT();},{passive:true});
window.addEventListener("load",resetView);
</script>
